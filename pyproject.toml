[project]
name = "nexus-memory"
version = "0.22.11"
description = "Universal Memory Layer for AI Agents — MCP-powered, self-hosted, secure."
authors = [{ name = "Nebo" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "bm25s>=0.1.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
voyage = ["voyageai>=0.3.0"]
openai = ["openai>=1.0.0"]
google = ["google-generativeai>=0.7.0"]
all = ["voyageai>=0.3.0", "openai>=1.0.0", "google-generativeai>=0.7.0", "fastapi>=0.100.0", "uvicorn>=0.20.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
nexus-memory = "nexus_memory.mcp_server:cli"
nexus-memory-init = "nexus_memory.wizard:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
# `plugins` is deliberately NOT listed. Hermes ships a top-level package of the
# same name (`plugins/memory/__init__.py`, the memory-provider discovery), and a
# wheel that also installs `plugins/` overwrites it: whichever distribution lands
# last wins the name, and an import of `plugins.memory` then resolves to this
# package's two-line stub instead of the discovery logic. Nothing in this
# repository imports `plugins` as an installed package — the shipped Hermes
# plugin is installed from this repo's git subdirectory (plugins/memory/nexus),
# not from the wheel, and the tests reach the directory by path.
include = ["nexus_memory*", "nexus*"]


# Handbook is served from the dashboard source checkout (dashboard/handbook),
# not installed globally — see dashboard/server.py handbook_dir. The old
# data-files entry installed HTML into <prefix>/share/, where no code read it
# (dashboard* is not even part of the wheel), so it was removed as dead config.

[tool.pytest.ini_options]
# auto: every `async def test_...` is treated as an asyncio test
# — no need to mark them explicitly. Keeps the existing test style
# (sync tests stay sync) and lets the MCP-server tests run with
# `pytest tests/` out of the box.
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    'ignore:Deprecated API:DeprecationWarning:qdrant_client.*',
    'ignore::DeprecationWarning:sentence_transformers.*',
    'ignore::DeprecationWarning:transformers.*',
    'ignore::DeprecationWarning:torch.*',
    'ignore::DeprecationWarning:mcp.*',
]
