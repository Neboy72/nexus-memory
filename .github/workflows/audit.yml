name: Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run for the same ref makes an in-flight older run obsolete —
# cancel it instead of paying for a stale result.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    # Least-privilege: this job only reads code and runs tests — no write
    # token scope. Without an explicit `permissions:` key the job inherits
    # the repository default (potentially read/write).
    permissions:
      contents: read
    # Bound the runner: a hung test/install must not occupy it indefinitely.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Collection-Name Check
        run: |
          echo "=== Checking for stale collection names ==="
          BAD_PATTERNS='("openclaw-memory"|"openclaw_beliefs"|"openclaw_events"|"nexus_beliefs"|"nexus_events"|"hermes-memory-1024d"|"kiosha-memory")'
          # -E: the pattern is an ERE alternation; plain grep (BRE) treats
          # parentheses/pipe as literals, which made this check a silent no-op.
          # Scope: ACTIVE runtime code (src/ + dashboard/ + plugins/) only.
          # nexus/ is the documented LEGACY layer (tests/test_apply.py pins
          # nexus_beliefs/nexus_events as deliberate backward-compat names,
          # and mcp_server still writes live events there), so those three
          # hits are intentional, not stale.
          # grep exit 1 = "no match" (the good case here); exit 2 = a REAL
          # error (bad pattern, unreadable path). `|| true` collapsed both
          # into "no match" and could hide a broken scan.
          set +e
          FOUND=$(grep -rnE "$BAD_PATTERNS" src/ dashboard/ plugins/ --include="*.py" --include="*.ts" --exclude="__pycache__" --exclude-dir=node_modules --exclude-dir=dist)
          GREP_EXIT=$?
          set -e
          if [ $GREP_EXIT -eq 2 ]; then
            echo "❌ grep failed (exit 2) while scanning for stale collection names"
            exit 2
          fi
          if [ -n "$FOUND" ]; then
            echo "❌ Stale collection names found:"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No stale collection names"

      - name: Status-Code Check
        run: |
          echo "=== Checking for hardcoded status_code == 200 / != 200 ==="
          # Allow only is_success() calls, not raw == 200 / != 200
          # grep exit 1 = no match (fine), exit 2 = real error (must fail).
          set +e
          FOUND=$(grep -rnE '\.status_code == 200|\.status_code != 200' nexus/ src/ --include="*.py" --exclude="__pycache__")
          GREP_EXIT=$?
          set -e
          if [ $GREP_EXIT -eq 2 ]; then
            echo "❌ grep failed (exit 2) while scanning for raw status_code checks"
            exit 2
          fi
          if [ -n "$FOUND" ]; then
            echo "❌ Raw status_code checks found (use is_success() instead):"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ All status_code checks use is_success()"

      - name: Python Compile Check
        run: |
          echo "=== Python compile check ==="
          python -m compileall nexus/ src/ -q
          echo "✅ All files compile"

      - name: Run Tests
        run: |
          echo "=== Running tests ==="
          # Capture pytest's exit code explicitly so a failing suite can never
          # be masked by `head`/`tail` exiting 0. -u disables stdout block
          # buffering (a SIGKILL mid-run would otherwise void the whole file —
          # observed 2026-09-15: exit 1 with a completely empty output file on
          # the hosted runner while Mac + Ubuntu replicas were green).
          # faulthandler guarantees a traceback on hard interpreter crashes.
          # -x stops at the first failure to bound runner memory usage.
          # set +e around the run: with `bash -e` a failing pytest aborted the
          # step BEFORE the tail/warning could print anything (bf35150/89df634
          # showed exit 1 with zero visible diagnostics).
          set +e
          python -u -X faulthandler -m pytest tests/ -q --tb=short -x > /tmp/pytest-out.txt 2>&1
          EXIT=$?
          set -e
          if [ ! -s /tmp/pytest-out.txt ]; then
            echo "⚠️ pytest produced NO output (exit=$EXIT) — process likely killed (OOM?) before any output."
          fi
          tail -120 /tmp/pytest-out.txt
          exit $EXIT
