[project]
# This directory is a Hermes plugin, not a standalone Python distribution: the
# file exists so the plugin manager can install the RUNTIME the provider needs.
# Without it, a catalog install brought only this folder (__init__.py,
# plugin.yaml, README.md) and the provider had no `nexus_memory` package — it
# loaded, then reported "the embedding provider is not importable" forever.
#
# Name is deliberately NOT "nexus-memory": that name belongs to an unrelated
# project on PyPI (shivamtyagi18/smriti-memcore), so asking for it by name from
# an index would install a stranger's code. The dependency resolves through
# `[tool.uv.sources]` to our own repository at a pinned commit instead.
name = "hermes-nexus-provider"
version = "0.22.14"
description = "Hermes MemoryProvider runtime for Nexus Memory."
requires-python = ">=3.11"

# One entry on purpose: `nexus-memory` declares its own runtime dependencies
# (qdrant-client, sentence-transformers, networkx, pyyaml, bm25s, requests,
# httpx, mcp), so uv resolves the full closure from the pin below. Listing them
# here as well would only create a second copy that can drift.
dependencies = [
    "nexus-memory",
]

[tool.uv]
# Declarative dependency holder only — nothing is built or packaged from this
# directory, so uv must not try to build a wheel out of it.
package = false

[tool.uv.sources]
# The provider's engine lives in this repository's `src/nexus_memory` and
# `nexus/` packages, which are NOT part of this plugin subdirectory. Point uv
# at our own repository at the reviewed commit so the engine arrives with the
# plugin; a bare index lookup would fetch the unrelated PyPI project.
nexus-memory = { git = "https://github.com/Neboy72/nexus-memory.git", rev = "469a71b0d786a593a0974215097a1ab9df6037eb" }
